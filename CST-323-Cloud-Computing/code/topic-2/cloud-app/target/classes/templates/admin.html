<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Admin Panel - Orders4U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            margin: 0;
            padding: 0;
        }
        
        /* Navbar */
        .navbar-custom {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 70px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .hamburger:hover {
            background: rgba(168, 85, 247, 0.15);
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .nav-menu {
            position: absolute;
            top: 75px;
            right: 20px;
            background: rgba(20, 18, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .nav-link i {
            font-size: 1.2rem;
            width: 22px;
            text-align: center;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 6px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
        }
        
        /* Main Content */
        .main-content {
            padding: 100px 40px 60px;
            max-width: 1000px;
            margin: 0 auto;
        }
        
        /* Back Link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            animation: fadeInUp 0.5s ease-out;
        }
        .back-link:hover {
            color: #a855f7;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Users Panel */
        .users-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 30px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .panel-title {
            color: #fff;
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .panel-title i {
            color: #ec4899;
        }
        .panel-badge {
            background: rgba(168, 85, 247, 0.15);
            color: #a855f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
        }
        
        /* User Row */
        .user-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease-out both;
        }
        .user-row:nth-child(1) { animation-delay: 0.15s; }
        .user-row:nth-child(2) { animation-delay: 0.2s; }
        .user-row:nth-child(3) { animation-delay: 0.25s; }
        .user-row:nth-child(4) { animation-delay: 0.3s; }
        .user-row:nth-child(n+5) { animation-delay: 0.35s; }
        
        .user-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(168, 85, 247, 0.2);
            transform: translateX(5px);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #ec4899 0%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.25);
        }
        .user-details {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .user-name {
            font-weight: 600;
            color: #fff;
            font-size: 1rem;
        }
        .user-role {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .role-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .role-badge.admin {
            background: rgba(236, 72, 153, 0.15);
            color: #ec4899;
        }
        .role-badge.user {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }
        
        /* User Actions */
        .user-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .action-btn {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 8px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-btn:hover {
            color: #fff;
        }
        .action-btn.edit:hover {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
        }
        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 90px 20px 40px;
            }
            .user-row {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            .user-actions {
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <a href="/" class="navbar-brand">Orders4U</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a th:href="@{/}" class="nav-link"><i class="bi bi-house"></i> Home</a>
            <a th:href="@{/orders}" class="nav-link"><i class="bi bi-box-seam"></i> Inventory</a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')"><i class="bi bi-gear"></i> Admin</a>
            <div class="menu-divider"></div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </nav>
    <script>
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.hamburger') && !e.target.closest('.nav-menu')) {
                document.querySelector('.hamburger').classList.remove('active');
                document.getElementById('navMenu').classList.remove('active');
            }
        });
    </script>
    
    <div class="main-content">
        <a th:href="@{/}" class="back-link">
            <i class="bi bi-arrow-left"></i>
            Back to Home
        </a>

        <div class="users-panel">
            <div class="panel-header">
                <span class="panel-title">
                    <i class="bi bi-people-fill"></i>
                    User Management
                </span>
                <span class="panel-badge" th:text="${#lists.size(users)} + ' users'">0 users</span>
            </div>

            <div th:each="user : ${users}" class="user-row">
                <div class="user-info">
                    <div class="user-avatar">
                        <span th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}">A</span>
                    </div>
                    <div class="user-details">
                        <span class="user-name" th:text="${user.username}">Username</span>
                        <div class="user-role">
                            <span class="role-badge" th:classappend="${user.role == 'ROLE_ADMIN'} ? 'admin' : 'user'">
                                <i th:class="${user.role == 'ROLE_ADMIN'} ? 'bi bi-shield-fill' : 'bi bi-person-fill'"></i>
                                <span th:text="${user.role == 'ROLE_ADMIN'} ? 'Admin' : 'User'">Role</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="user-actions">
                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="action-btn edit">
                        <i class="bi bi-pencil"></i>
                        Edit
                    </a>
                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="action-btn delete">
                        <i class="bi bi-trash"></i>
                        Delete
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
