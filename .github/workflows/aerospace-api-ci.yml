name: Aerospace API CI

on:
  push:
    paths:
      - "SummerPractice/AerospaceAPI/**"
      - "NuGet.Config"
      - ".github/workflows/aerospace-api-ci.yml"
  pull_request:
    paths:
      - "SummerPractice/AerospaceAPI/**"
      - "NuGet.Config"
      - ".github/workflows/aerospace-api-ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SummerPractice/AerospaceAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AircraftMaintenanceAPI/AircraftMaintenanceAPI.sln --configfile ../../NuGet.Config
      - name: Build
        run: dotnet build AircraftMaintenanceAPI/AircraftMaintenanceAPI.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test AircraftMaintenanceAPI/AircraftMaintenanceAPI.sln --configuration Release --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SummerPractice/AerospaceAPI/aircraft-maintenance-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: SummerPractice/AerospaceAPI/aircraft-maintenance-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
        env:
          CI: true
      - name: Build
        run: npm run build
        env:
          CI: true
