<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Inventory - Orders4U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            margin: 0;
            padding: 0;
        }
        
        /* Navbar */
        .navbar-custom {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 70px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .hamburger:hover {
            background: rgba(168, 85, 247, 0.15);
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .nav-menu {
            position: absolute;
            top: 75px;
            right: 20px;
            background: rgba(20, 18, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .nav-link i {
            font-size: 1.2rem;
            width: 22px;
            text-align: center;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 6px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
        }
        
        /* Main Content */
        .main-content {
            padding: 100px 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Page Header */
        .page-header {
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 1rem;
        }
        
        /* Section */
        .section {
            margin-bottom: 50px;
        }
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            font-weight: 500;
        }
        .section-header i {
            color: #a855f7;
        }
        
        /* Orders Grid */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        
        .order-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: block;
            animation: fadeInUp 0.6s ease-out both;
        }
        .order-card:nth-child(1) { animation-delay: 0.05s; }
        .order-card:nth-child(2) { animation-delay: 0.1s; }
        .order-card:nth-child(3) { animation-delay: 0.15s; }
        .order-card:nth-child(4) { animation-delay: 0.2s; }
        .order-card:nth-child(5) { animation-delay: 0.25s; }
        .order-card:nth-child(6) { animation-delay: 0.3s; }
        .order-card:nth-child(n+7) { animation-delay: 0.35s; }
        
        .order-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(168, 85, 247, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        .order-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            transition: all 0.3s ease;
        }
        .order-card:hover .order-icon {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(139, 92, 246, 0.3) 100%);
            transform: scale(1.05);
        }
        .order-icon i {
            font-size: 1.6rem;
            color: #a855f7;
        }
        .order-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Add Card */
        .add-card {
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .add-card:hover {
            transform: translateY(-5px);
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.05);
        }
        .add-card .order-icon {
            background: transparent;
            border: 1px solid rgba(168, 85, 247, 0.3);
        }
        .add-card:hover .order-icon {
            background: rgba(168, 85, 247, 0.1);
        }
        .add-card .order-icon i {
            color: #a855f7;
        }
        .add-card .order-label {
            color: #a855f7;
        }
        
        /* Empty State */
        .empty-message {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
            padding: 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                padding: 90px 20px 40px;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .orders-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <a href="/" class="navbar-brand">Orders4U</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a th:href="@{/}" class="nav-link"><i class="bi bi-house"></i> Home</a>
            <a th:href="@{/orders}" class="nav-link"><i class="bi bi-box-seam"></i> Inventory</a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')"><i class="bi bi-gear"></i> Admin</a>
            <div class="menu-divider"></div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </nav>
    <script>
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.hamburger') && !e.target.closest('.nav-menu')) {
                document.querySelector('.hamburger').classList.remove('active');
                document.getElementById('navMenu').classList.remove('active');
            }
        });
    </script>
    
    <div class="main-content">
        <div class="page-header">
            <h1 class="page-title">Inventory</h1>
            <p class="page-subtitle">Manage your orders and products</p>
        </div>

        <div class="section">
            <div class="section-header">
                <i class="bi bi-grid-3x3-gap"></i>
                <span>All Orders</span>
            </div>
            <div class="orders-grid">
                <a th:each="order : ${orders}" th:href="@{/orders/showOrder/{id}(id=${order.id})}" class="order-card">
                    <div class="order-icon">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div class="order-label" th:text="${order.product_name}">Product Name</div>
                </a>
                <a th:href="@{/orders/newOrder}" class="add-card">
                    <div class="order-icon">
                        <i class="bi bi-plus-lg"></i>
                    </div>
                    <div class="order-label">New Order</div>
                </a>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <i class="bi bi-star-fill"></i>
                <span>Favorite Orders</span>
            </div>
            <div class="orders-grid">
                <th:block th:with="favoriteOrders=${orders.?[id % 2 == 0]}">
                    <div th:if="${#lists.isEmpty(favoriteOrders)}" class="empty-message">
                        <i class="bi bi-star me-2"></i>
                        No favorite orders yet
                    </div>
                </th:block>
                <a th:each="order : ${orders}" th:if="${order.id % 2 == 0}" th:href="@{/orders/showOrder/{id}(id=${order.id})}" class="order-card">
                    <div class="order-icon">
                        <i class="bi bi-star-fill"></i>
                    </div>
                    <div class="order-label" th:text="${order.product_name}">Product Name</div>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
