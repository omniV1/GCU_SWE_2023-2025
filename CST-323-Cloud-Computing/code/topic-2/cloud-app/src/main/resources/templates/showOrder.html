<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Order Details - Orders4U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            margin: 0;
            padding: 0;
        }
        
        /* Navbar */
        .navbar-custom {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 70px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .hamburger:hover {
            background: rgba(168, 85, 247, 0.15);
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .nav-menu {
            position: absolute;
            top: 75px;
            right: 20px;
            background: rgba(20, 18, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .nav-link i {
            font-size: 1.2rem;
            width: 22px;
            text-align: center;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 6px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
        }
        
        /* Main Content */
        .main-content {
            padding: 110px 40px 60px;
            display: flex;
            justify-content: center;
        }
        
        /* Order Panel */
        .order-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Order Icon */
        .order-icon-section {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
        }
        .order-icon-large {
            width: 100px;
            height: 100px;
            border-radius: 24px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);
        }
        .order-icon-large i {
            font-size: 2.8rem;
            color: white;
        }
        
        /* Detail Rows */
        .detail-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .detail-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(168, 85, 247, 0.2);
        }
        .detail-row label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            font-weight: 500;
        }
        .detail-row span {
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        /* Buttons */
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-action {
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            color: white;
            flex: 1;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-edit {
            background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.25);
        }
        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(59, 130, 246, 0.35);
            color: white;
        }
        .btn-delete {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.25);
        }
        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(239, 68, 68, 0.35);
            color: white;
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color: white;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .main-content {
                padding: 90px 20px 40px;
            }
            .order-panel {
                padding: 30px 25px;
            }
            .button-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <a href="/" class="navbar-brand">Orders4U</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a th:href="@{/}" class="nav-link"><i class="bi bi-house"></i> Home</a>
            <a th:href="@{/orders}" class="nav-link"><i class="bi bi-box-seam"></i> Inventory</a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')"><i class="bi bi-gear"></i> Admin</a>
            <div class="menu-divider"></div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </nav>
    <script>
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.hamburger') && !e.target.closest('.nav-menu')) {
                document.querySelector('.hamburger').classList.remove('active');
                document.getElementById('navMenu').classList.remove('active');
            }
        });
    </script>
    
    <div class="main-content">
        <div class="order-panel">
            <div class="order-icon-section">
                <div class="order-icon-large">
                    <i class="bi bi-box-seam"></i>
                </div>
            </div>

            <div class="detail-row">
                <label>Order Number</label>
                <span th:text="${order.order_number}">#12345</span>
            </div>

            <div class="detail-row">
                <label>Product Name</label>
                <span th:text="${order.product_name}">Product</span>
            </div>

            <div class="detail-row">
                <label>Price</label>
                <span th:text="'$' + ${order.price}">$0.00</span>
            </div>

            <div class="detail-row">
                <label>Quantity</label>
                <span th:text="${order.quantity}">0</span>
            </div>

            <div class="button-row">
                <a th:href="@{/orders/editOrder/{id}(id=${order.id})}" class="btn-action btn-edit">
                    <i class="bi bi-pencil"></i>
                    Edit
                </a>
                <a th:href="@{/orders/deleteOrder/{id}(id=${order.id})}" class="btn-action btn-delete" onclick="return confirm('Are you sure you want to delete this order?')">
                    <i class="bi bi-trash"></i>
                    Delete
                </a>
                <a th:href="@{/orders}" class="btn-action btn-back">
                    <i class="bi bi-arrow-left"></i>
                    Back
                </a>
            </div>
        </div>
    </div>
</body>
</html>
