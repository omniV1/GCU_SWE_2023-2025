<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Add Comment</title>
</head>
<body>
    <div layout:fragment="content"> 
        <h1>Add Comment</h1>
        <form th:action="@{/add}" th:object="${comment}" method="post">
            <div class="form-group">
                <label for="author">Author</label>
                <input type="text" id="author" th:field="*{author}" placeholder="Enter your name" required>
            </div>
            <div class="form-group">
                <label for="text">Comment</label>
                <textarea id="text" th:field="*{text}" placeholder="Write your comment here" rows="5" required></textarea>
            </div>
            <button type="submit">Add Comment</button>
        </form>
    </div>
</body>
</html>
