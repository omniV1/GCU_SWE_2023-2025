<!-- layout.html -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title th:text="${pageTitle} + ' - GCU Events App'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
            <!-- GCU Header -->
            <div class="gcu-header">
                <strong>GRAND CANYON UNIVERSITY</strong><br>
                <span style="font-size: 12px; color: var(--text-muted);">Events Management System</span>
            </div>
    
    <!-- Navigation -->
    <nav>
        <ul>
            <li><a th:href="@{/users/}">Home</a></li>
            
            <!-- Show register and login links only when user is not authenticated -->
            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/users/register}">Register</a>
            </li>
            <li sec:authorize="!isAuthenticated()">
                <a th:href="@{/users/loginForm}">Login</a>
            </li>
            
            <!-- Show user info and logout only when user is authenticated -->
            <li sec:authorize="isAuthenticated()" class="user-info">
                <span>Welcome, <span sec:authentication="name"></span></span>
            </li>
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/users/logout}">Logout</a>
            </li>
            
            <!-- Events link - available to all users -->
            <li><a th:href="@{/events}">Events</a></li>
            
            <!-- Protected event operations - only for authenticated users -->
            <li sec:authorize="isAuthenticated()">
                <a th:href="@{/events/create}">Create Event</a>
            </li>
            
            <!-- Search events - available to all users -->
            <li><a th:href="@{/events/search}">Search Events</a></li>
             
        </ul>
    </nav>
    
    <!-- Main Content Wrapper -->
    <div class="content-wrapper">
        <div layout:fragment="content">
            <!-- Content will be inserted here -->
        </div>
    </div>
    
            <!-- Footer -->
            <footer>
                <p>&copy; 2024 Grand Canyon University - Events Management System | Built with Spring Boot & Security</p>
            </footer>
</body>
</html>
<!-- end of file -->
