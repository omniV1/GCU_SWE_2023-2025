<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Activity 5 Practice Test — Deploy to Google Cloud</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f4f6f9;
      color: #222;
    }
    h1 { text-align: center; color: #1a73e8; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #555; margin-bottom: 10px; font-size: 0.95em; }
    #progress-bar-wrap {
      background: #dde3f0;
      border-radius: 8px;
      height: 12px;
      margin: 0 0 8px;
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      background: #1a73e8;
      width: 0%;
      transition: width 0.3s;
      border-radius: 8px;
    }
    #progress-label {
      text-align: center;
      font-size: 0.85em;
      color: #555;
      margin-bottom: 24px;
    }
    #score-live {
      text-align: center;
      font-size: 1em;
      font-weight: bold;
      color: #1a73e8;
      margin-bottom: 20px;
      min-height: 1.4em;
    }
    .question-block {
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      margin-bottom: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      transition: border 0.2s;
    }
    .question-block.answered { border-left: 4px solid #ccc; }
    .question-block.answered.got-correct { border-left-color: #28a745; }
    .question-block.answered.got-wrong { border-left-color: #dc3545; }
    .question-block p { font-weight: bold; margin-bottom: 12px; font-size: 1em; }
    .question-block label {
      display: block;
      margin: 8px 0;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 5px;
      transition: background 0.15s;
      user-select: none;
    }
    .question-block label:hover:not(.locked) { background: #f0f4ff; }
    .question-block label.locked { cursor: default; }
    .question-block input[type="radio"] { margin-right: 10px; }
    .correct-highlight { background: #d4edda !important; color: #155724; font-weight: bold; }
    .incorrect-highlight { background: #f8d7da !important; color: #721c24; }
    .feedback {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 0.9em;
      display: none;
    }
    .correct-feedback { background: #d4edda; color: #155724; }
    .incorrect-feedback { background: #f8d7da; color: #721c24; }
    .btn-reset {
      display: block;
      margin: 10px auto 40px;
      padding: 12px 40px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1em;
      cursor: pointer;
    }
    .btn-reset:hover { background: #1558b0; }
    #final-score {
      display: none;
      text-align: center;
      font-size: 1.4em;
      font-weight: bold;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 24px;
      background: #e8f0fe;
      color: #1a73e8;
    }
    #final-score .grade { font-size: 1.8em; margin-top: 6px; }
  </style>
</head>
<body>

<h1>Activity 5 Practice Test</h1>
<p class="subtitle">Deploying Spring Boot + MySQL to Google Cloud Platform &mdash; 30 Questions (randomized each session)</p>
<div id="progress-bar-wrap"><div id="progress-bar"></div></div>
<div id="progress-label">0 / 30 answered</div>
<div id="score-live"></div>

<div id="quiz-container"></div>

<div id="final-score">
  <div id="final-text"></div>
  <div class="grade" id="final-grade"></div>
</div>
<button class="btn-reset" onclick="initQuiz()">Shuffle &amp; Restart</button>

<script>
const allQuestions = [
  {
    id: 'q1',
    text: 'What is Google Compute Engine equivalent to in Amazon Web Services?',
    options: ['Cloud SQL', 'App Engine', 'EC2 (Elastic Compute Cloud)', 'Cloud Storage'],
    correct: 2,
    explanation: 'Compute Engine is Google\'s VM service, equivalent to AWS EC2.'
  },
  {
    id: 'q2',
    text: 'How much in free credits does Google Cloud give new accounts, and for how long?',
    options: ['$100 for 30 days', '$200 for 60 days', '$300 for 90 days', '$500 for 120 days'],
    correct: 2,
    explanation: 'Google Cloud gives $300 in free credits valid for 90 days.'
  },
  {
    id: 'q3',
    text: 'Which Google Cloud SQL edition is recommended for CST-323 student projects?',
    options: ['Cloud SQL Enterprise Plus', 'Cloud SQL Enterprise', 'Sandbox (MySQL 8.0)', 'Cloud SQL Developer Edition'],
    correct: 2,
    explanation: 'Sandbox (MySQL 8.0) is cost-effective and free-tier eligible — perfect for student projects.'
  },
  {
    id: 'q4',
    text: 'What port does MySQL use by default when connecting via MySQL Workbench?',
    options: ['8080', '443', '5432', '3306'],
    correct: 3,
    explanation: 'MySQL\'s default port is 3306.'
  },
  {
    id: 'q5',
    text: 'Why is utf8mb4 the recommended character set for the database in this activity?',
    options: [
      'It is faster than ASCII encoding',
      'It provides full Unicode support including emoji and all modern languages',
      'It is required by Google Cloud SQL',
      'It compresses data automatically'
    ],
    correct: 1,
    explanation: 'utf8mb4 supports all Unicode characters including emoji, preventing data loss with multilingual content.'
  },
  {
    id: 'q6',
    text: 'What is the purpose of the <code>com.google.cloud.sql</code> dependency in pom.xml?',
    options: [
      'It provides the MySQL JDBC driver',
      'It connects App Engine to Cloud SQL through a secure internal socket factory instead of a public IP',
      'It enables Hibernate ORM support',
      'It installs the Google Cloud CLI tools'
    ],
    correct: 1,
    explanation: 'The Cloud SQL Socket Factory routes connections through Google\'s secure internal network instead of a public IP.'
  },
  {
    id: 'q7',
    text: 'What error will you see if you omit the Cloud SQL Socket Factory dependency and deploy to App Engine Standard?',
    options: [
      'NullPointerException in Spring context',
      '404 Not Found from App Engine',
      'Communications link failure or Connection refused',
      'YAML parse error on startup'
    ],
    correct: 2,
    explanation: 'Without the Socket Factory, App Engine Standard cannot reach the database, resulting in "Communications link failure."'
  },
  {
    id: 'q8',
    text: 'What does <code>env: standard</code> mean in the app.yaml file?',
    options: [
      'The app runs on a bare-metal server',
      'The app uses App Engine\'s lightweight, fully managed environment with automatic scaling',
      'The app is deployed using Docker containers',
      'The environment is set to development mode'
    ],
    correct: 1,
    explanation: 'The Standard environment is lightweight, fully managed, and part of Google\'s Free Tier.'
  },
  {
    id: 'q9',
    text: 'What does setting <code>min_instances: 0</code> in app.yaml accomplish?',
    options: [
      'Guarantees the app is always running',
      'Disables autoscaling',
      'Shuts all instances down when idle, reducing cost to zero when not in use',
      'Limits the app to one request at a time'
    ],
    correct: 2,
    explanation: 'min_instances: 0 allows GCP to shut down all instances when idle, eliminating cost during inactivity.'
  },
  {
    id: 'q10',
    text: 'Which command builds the deployable JAR file for the Spring Boot application?',
    options: [
      '<code>gcloud app deploy</code>',
      '<code>mvn clean package -DskipTests</code>',
      '<code>java -jar build.jar</code>',
      '<code>gcloud builds submit</code>'
    ],
    correct: 1,
    explanation: 'mvn clean package -DskipTests compiles the project and packages it into a runnable JAR.'
  },
  {
    id: 'q11',
    text: 'What is the purpose of the <code>entrypoint</code> field in app.yaml?',
    options: [
      'It specifies the region where the app is deployed',
      'It tells App Engine how to start the Spring Boot application',
      'It sets the Java version for the runtime',
      'It defines the database connection string'
    ],
    correct: 1,
    explanation: 'The entrypoint tells App Engine the command to execute to launch your Spring Boot server.'
  },
  {
    id: 'q12',
    text: 'How do environment variables defined in app.yaml get injected into Spring Boot?',
    options: [
      'Spring Boot reads app.yaml directly at startup',
      'Maven copies them into the JAR during packaging',
      'application.properties uses <code>${VARIABLE_NAME}</code> placeholders that Spring resolves from environment variables at runtime',
      'The Google Cloud CLI injects them before the JAR starts'
    ],
    correct: 2,
    explanation: 'Spring Boot reads ${VARIABLE_NAME} placeholders in application.properties and resolves them from the OS environment variables at runtime.'
  },
  {
    id: 'q13',
    text: 'Why is it NOT recommended to use default values in application.properties (e.g., <code>${PORT:8080}</code>)?',
    options: [
      'Default values slow down startup time',
      'If environment variables fail, defaults silently mask the problem with connection errors instead of clear "missing parameter" messages',
      'Google Cloud does not support default values',
      'Defaults cause YAML parse errors'
    ],
    correct: 1,
    explanation: 'Defaults silently connect to localhost and fail with vague connection errors instead of clearly indicating a missing environment variable.'
  },
  {
    id: 'q14',
    text: 'What command is used to deploy the Spring Boot app to Google App Engine?',
    options: [
      '<code>gcloud run deploy</code>',
      '<code>mvn deploy -Pgcloud</code>',
      '<code>gcloud app deploy</code>',
      '<code>gcloud compute deploy</code>'
    ],
    correct: 2,
    explanation: 'gcloud app deploy is the standard command for deploying to App Engine.'
  },
  {
    id: 'q15',
    text: 'What command streams live logs from your deployed App Engine service?',
    options: [
      '<code>gcloud app logs read</code>',
      '<code>gcloud app logs tail -s default</code>',
      '<code>gcloud logging watch</code>',
      '<code>gcloud app debug --stream</code>'
    ],
    correct: 1,
    explanation: 'gcloud app logs tail -s default streams live logs from the default App Engine service.'
  },
  {
    id: 'q16',
    text: 'What role must be granted to the App Engine service account so that deployments can upload files to Cloud Storage?',
    options: [
      'roles/cloudsql.admin',
      'roles/appengine.deployer',
      'roles/storage.admin',
      'roles/iam.serviceAccountUser'
    ],
    correct: 2,
    explanation: 'roles/storage.admin allows the App Engine service account to upload JAR files to Cloud Storage during deployment.'
  },
  {
    id: 'q17',
    text: 'Which sslMode option in the JDBC URL enforces both hostname verification AND certificate validation?',
    options: ['REQUIRED', 'VERIFY_CA', 'VERIFY_IDENTITY', 'DISABLED'],
    correct: 2,
    explanation: 'VERIFY_IDENTITY checks both the CA certificate and the server hostname, providing the strongest SSL verification.'
  },
  {
    id: 'q18',
    text: 'Why is <code>sslMode=DISABLED</code> acceptable when using the Cloud SQL Socket Factory?',
    options: [
      'Cloud SQL does not support SSL',
      'The Socket Factory itself handles the secure channel, making an additional SSL layer redundant',
      'SSL is only required for production accounts',
      'App Engine Standard blocks SSL connections'
    ],
    correct: 1,
    explanation: 'The Socket Factory creates a secure encrypted tunnel so adding SSL on top is unnecessary.'
  },
  {
    id: 'q19',
    text: 'What does the <code>cloudSqlInstance</code> parameter in the JDBC URL identify?',
    options: [
      'The local IP address of the database',
      'The Spring Boot application name',
      'The specific Cloud SQL instance in the format Project:Region:Instance',
      'The Cloud Storage bucket used for backups'
    ],
    correct: 2,
    explanation: 'cloudSqlInstance identifies the specific Cloud SQL instance using the format Project:Region:Instance.'
  },
  {
    id: 'q20',
    text: 'What does <code>SPRING_JPA_HIBERNATE_DDL_AUTO: "update"</code> tell Hibernate to do?',
    options: [
      'Drop and recreate all tables on every startup',
      'Create tables if they don\'t exist and update columns if the entity model changes',
      'Disable all database schema management',
      'Validate the schema without making any changes'
    ],
    correct: 1,
    explanation: '"update" tells Hibernate to create missing tables and alter existing columns without dropping data.'
  },
  {
    id: 'q21',
    text: 'What is the most cost-effective Cloud SQL and App Engine setup for a student project?',
    options: [
      'App Engine Flexible + Cloud SQL Enterprise Plus',
      'App Engine Standard + Cloud SQL Sandbox + stopping unused versions',
      'Compute Engine VM + MySQL Enterprise',
      'Cloud Run + Cloud SQL Enterprise'
    ],
    correct: 1,
    explanation: 'App Engine Standard + Cloud SQL Sandbox is free-tier eligible. Stopping unused versions avoids lingering charges.'
  },
  {
    id: 'q22',
    text: 'Where should the app.yaml file be placed in the project structure?',
    options: [
      'Inside the <code>src/main/resources</code> folder',
      'Inside the <code>target</code> folder',
      'In the project root, the same folder as pom.xml',
      'Inside the <code>.github</code> folder'
    ],
    correct: 2,
    explanation: 'app.yaml must be in the project root alongside pom.xml so gcloud app deploy can find it.'
  },
  {
    id: 'q23',
    text: 'Which gcloud command sets the active project before deploying?',
    options: [
      '<code>gcloud projects use &lt;PROJECT_ID&gt;</code>',
      '<code>gcloud config set project &lt;PROJECT_ID&gt;</code>',
      '<code>gcloud init --project &lt;PROJECT_ID&gt;</code>',
      '<code>gcloud app set project &lt;PROJECT_ID&gt;</code>'
    ],
    correct: 1,
    explanation: 'gcloud config set project sets the active project context for all subsequent gcloud commands.'
  },
  {
    id: 'q24',
    text: 'What does <code>gcloud app deploy --no-cache</code> do?',
    options: [
      'Skips uploading static files',
      'Forces a clean rebuild by skipping cached Docker or Maven layers',
      'Disables Cloud Storage during deployment',
      'Deploys without prompting for confirmation'
    ],
    correct: 1,
    explanation: '--no-cache forces a clean rebuild, useful when cached build artifacts cause repeated deployment failures.'
  },
  {
    id: 'q25',
    text: 'What error message indicates the database password in app.yaml is wrong or missing?',
    options: [
      '<code>404 Not Found</code>',
      '<code>jar not found in target directory</code>',
      "<code>Access denied for user 'root'@'cloudsqlproxy~IP'</code>",
      '<code>YAML indentation error on line 3</code>'
    ],
    correct: 2,
    explanation: '"Access denied for user root@cloudsqlproxy" is the Cloud SQL error when credentials are wrong or missing.'
  },
  {
    id: 'q26',
    text: 'Which command opens the deployed App Engine app in your browser?',
    options: [
      '<code>gcloud app open</code>',
      '<code>gcloud app browse</code>',
      '<code>gcloud app view</code>',
      '<code>gcloud app launch</code>'
    ],
    correct: 1,
    explanation: 'gcloud app browse opens the deployed app URL in your default browser.'
  },
  {
    id: 'q27',
    text: 'What is the primary purpose of a Google Cloud Project?',
    options: [
      'To store source code in version control',
      'To group billing, permissions, and resources (databases, servers, storage) in one organized unit',
      'To define the runtime environment for App Engine',
      'To configure firewall rules for a VPC'
    ],
    correct: 1,
    explanation: 'A Google Cloud Project is a container that groups billing, IAM permissions, and cloud resources together.'
  },
  {
    id: 'q28',
    text: 'What is the Google Cloud equivalent of AWS Elastic Beanstalk for deploying web applications?',
    options: ['Compute Engine', 'Cloud Run', 'App Engine', 'Cloud Functions'],
    correct: 2,
    explanation: 'App Engine is Google\'s PaaS offering, comparable to AWS Elastic Beanstalk.'
  },
  {
    id: 'q29',
    text: 'What is the Google Cloud equivalent of Amazon RDS for managed relational databases?',
    options: ['Cloud Spanner', 'Firestore', 'BigQuery', 'Cloud SQL'],
    correct: 3,
    explanation: 'Cloud SQL is Google\'s fully managed relational database service, equivalent to Amazon RDS.'
  },
  {
    id: 'q30',
    text: 'For a production app, what should replace plain-text passwords stored in app.yaml?',
    options: [
      'Base64-encoded strings in application.properties',
      'Google Secret Manager with a service account to inject secrets at runtime',
      'A private GitHub repository',
      'Environment variables hardcoded in the Java source code'
    ],
    correct: 1,
    explanation: 'Google Secret Manager stores secrets securely and injects them at runtime via a service account, keeping credentials out of config files.'
  }
];

const LETTERS = ['A', 'B', 'C', 'D'];
let shuffledQuestions = [];
let answeredCount = 0;
let correctCount = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQuiz() {
  answeredCount = 0;
  correctCount = 0;
  shuffledQuestions = shuffle(allQuestions);

  const container = document.getElementById('quiz-container');
  container.innerHTML = '';

  shuffledQuestions.forEach((q, idx) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.id = 'block-' + idx;

    const pText = document.createElement('p');
    pText.innerHTML = `${idx + 1}. ${q.text}`;
    block.appendChild(pText);

    q.options.forEach((opt, optIdx) => {
      const label = document.createElement('label');
      label.id = `label-${idx}-${optIdx}`;
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'q-' + idx;
      radio.value = optIdx;
      radio.addEventListener('change', () => handleAnswer(idx, optIdx));
      label.appendChild(radio);
      const span = document.createElement('span');
      span.innerHTML = ` ${LETTERS[optIdx]}. ${opt}`;
      label.appendChild(span);
      block.appendChild(label);
    });

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = 'feedback-' + idx;
    block.appendChild(feedback);

    container.appendChild(block);
  });

  updateProgress();
  updateLiveScore();
  document.getElementById('final-score').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function handleAnswer(qIdx, chosenOptIdx) {
  const q = shuffledQuestions[qIdx];
  const block = document.getElementById('block-' + qIdx);
  const feedback = document.getElementById('feedback-' + qIdx);

  // Disable all radios for this question
  block.querySelectorAll('input[type="radio"]').forEach(r => r.disabled = true);
  block.querySelectorAll('label').forEach(l => l.classList.add('locked'));

  const isCorrect = chosenOptIdx === q.correct;

  // Highlight chosen answer
  const chosenLabel = document.getElementById(`label-${qIdx}-${chosenOptIdx}`);
  chosenLabel.classList.add(isCorrect ? 'correct-highlight' : 'incorrect-highlight');

  // Always reveal correct answer
  if (!isCorrect) {
    document.getElementById(`label-${qIdx}-${q.correct}`).classList.add('correct-highlight');
  }

  // Show feedback
  feedback.className = 'feedback ' + (isCorrect ? 'correct-feedback' : 'incorrect-feedback');
  feedback.innerHTML = isCorrect
    ? `&#10003; Correct! ${q.explanation}`
    : `&#10007; Incorrect &mdash; correct answer: <strong>${LETTERS[q.correct]}</strong>. ${q.explanation}`;
  feedback.style.display = 'block';

  // Update block border
  block.classList.add('answered', isCorrect ? 'got-correct' : 'got-wrong');

  answeredCount++;
  if (isCorrect) correctCount++;

  updateProgress();
  updateLiveScore();

  if (answeredCount === shuffledQuestions.length) showFinal();
}

function updateProgress() {
  const total = shuffledQuestions.length;
  const pct = total ? (answeredCount / total) * 100 : 0;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-label').textContent = `${answeredCount} / ${total} answered`;
}

function updateLiveScore() {
  if (answeredCount === 0) {
    document.getElementById('score-live').textContent = '';
    return;
  }
  const pct = Math.round((correctCount / answeredCount) * 100);
  document.getElementById('score-live').textContent = `Score so far: ${correctCount} / ${answeredCount} (${pct}%)`;
}

function showFinal() {
  const total = shuffledQuestions.length;
  const pct = Math.round((correctCount / total) * 100);
  let grade = '';
  if (pct >= 90) grade = 'A';
  else if (pct >= 80) grade = 'B';
  else if (pct >= 70) grade = 'C';
  else if (pct >= 60) grade = 'D';
  else grade = 'F';

  const box = document.getElementById('final-score');
  document.getElementById('final-text').textContent = `Final Score: ${correctCount} / ${total} (${pct}%)`;
  document.getElementById('final-grade').textContent = `Grade: ${grade}`;
  box.style.display = 'block';
  box.scrollIntoView({ behavior: 'smooth' });
}

// Start on load
initQuiz();
</script>

</body>
</html>
