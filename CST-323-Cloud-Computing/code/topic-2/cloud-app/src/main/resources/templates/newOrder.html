<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>New Order - Orders4U</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        * {
            font-family: 'Outfit', sans-serif;
        }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            margin: 0;
            padding: 0;
        }
        
        /* Navbar */
        .navbar-custom {
            background: rgba(15, 12, 41, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            min-height: 70px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            padding: 4px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .hamburger:hover {
            background: rgba(168, 85, 247, 0.15);
        }
        .hamburger span {
            display: block;
            width: 22px;
            height: 2px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }
        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }
        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }
        .nav-menu {
            position: absolute;
            top: 75px;
            right: 20px;
            background: rgba(20, 18, 50, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-15px) scale(0.95);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-menu.active {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
        .nav-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
        }
        .nav-link i {
            font-size: 1.2rem;
            width: 22px;
            text-align: center;
        }
        .logout-btn {
            background: rgba(239, 68, 68, 0.1);
            border: none;
            color: #ef4444;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 10px;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 6px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
        }
        
        /* Main Content */
        .main-content {
            padding: 110px 40px 60px;
            display: flex;
            justify-content: center;
        }
        
        /* Order Panel */
        .order-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            animation: fadeInUp 0.6s ease-out;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .panel-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .panel-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 15px 30px rgba(34, 197, 94, 0.25);
        }
        .panel-icon i {
            font-size: 2rem;
            color: white;
        }
        .panel-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }
        .panel-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
        }
        
        /* Form */
        .form-row {
            margin-bottom: 18px;
        }
        .form-label {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            font-weight: 500;
            display: block;
        }
        .form-control {
            border-radius: 12px;
            padding: 14px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.95rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .form-control:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            outline: none;
        }
        
        /* Buttons */
        .button-row {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }
        .btn-submit {
            background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
            border: none;
            border-radius: 12px;
            padding: 14px 24px;
            color: white;
            flex: 1;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(34, 197, 94, 0.35);
            color: white;
        }
        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 14px 24px;
            color: white;
            flex: 1;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            color: white;
        }
        
        /* Responsive */
        @media (max-width: 576px) {
            .main-content {
                padding: 90px 20px 40px;
            }
            .order-panel {
                padding: 30px 25px;
            }
            .button-row {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar-custom">
        <a href="/" class="navbar-brand">Orders4U</a>
        <div class="hamburger" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-menu" id="navMenu">
            <a th:href="@{/}" class="nav-link"><i class="bi bi-house"></i> Home</a>
            <a th:href="@{/orders}" class="nav-link"><i class="bi bi-box-seam"></i> Inventory</a>
            <a th:href="@{/admin/users}" class="nav-link" sec:authorize="hasRole('ADMIN')"><i class="bi bi-gear"></i> Admin</a>
            <div class="menu-divider"></div>
            <form th:action="@{/logout}" method="post" style="margin: 0;">
                <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i> Logout</button>
            </form>
        </div>
    </nav>
    <script>
        function toggleMenu() {
            document.querySelector('.hamburger').classList.toggle('active');
            document.getElementById('navMenu').classList.toggle('active');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.hamburger') && !e.target.closest('.nav-menu')) {
                document.querySelector('.hamburger').classList.remove('active');
                document.getElementById('navMenu').classList.remove('active');
            }
        });
    </script>
    
    <div class="main-content">
        <div class="order-panel">
            <div class="panel-header">
                <div class="panel-icon">
                    <i class="bi bi-plus-lg"></i>
                </div>
                <h1 class="panel-title">Create New Order</h1>
                <p class="panel-subtitle">Fill in the details below</p>
            </div>
            
            <form method="post" th:action="@{/orders/processNewOrder}" th:object="${order}">
                <input type="hidden" th:field="*{id}"/>

                <div class="form-row">
                    <label class="form-label">Order Number</label>
                    <input type="text" class="form-control" th:field="*{order_number}" placeholder="Enter order number" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" th:field="*{product_name}" placeholder="Enter product name" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Price</label>
                    <input type="text" class="form-control" th:field="*{price}" placeholder="Enter price (e.g., 29.99)" required>
                </div>

                <div class="form-row">
                    <label class="form-label">Quantity</label>
                    <input type="text" class="form-control" th:field="*{quantity}" placeholder="Enter quantity" required>
                </div>

                <div class="button-row">
                    <a th:href="@{/orders}" class="btn-cancel">
                        <i class="bi bi-x-lg"></i>
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-submit">
                        <i class="bi bi-check-lg"></i>
                        Create Order
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
