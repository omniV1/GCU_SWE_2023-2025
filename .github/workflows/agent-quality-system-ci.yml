name: Agent Quality System CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - ".github/workflows/agent-quality-system-ci.yml"
      - "agent-quality-system/**"
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/agent-quality-system-ci.yml"
      - "agent-quality-system/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: agent-quality-system

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            agent-quality-system/requirements.txt
            agent-quality-system/requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run deterministic unit tests
        run: python -m pytest -q
