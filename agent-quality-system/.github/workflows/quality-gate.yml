name: Multi-Agent Quality Gate

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - '**.py'
      - '**.java'
      - '**.cs'
      - '**.js'
      - '**.ts'
      - '**.c'
      - '**.cpp'
      - '**.h'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.py'
      - '**.java'
      - '**.cs'
      - '**.js'
      - '**.ts'
      - '**.c'
      - '**.cpp'
      - '**.h'

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install radon numpy pandas rich matplotlib requests
    
    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          **.py
          **.java
          **.cs
          **.js
          **.ts
          **.c
          **.cpp
          **.h
        files_ignore: |
          **/training/**
          **/data/**
          demo*.py
          demo_*.py
          test_*.py
          sample_*.py
    
    - name: Run Quality Gate Analysis
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "╭──────────────────────────────────────────╮"
        echo "│  Multi-Agent Code Quality Gate Check     │"
        echo "╰──────────────────────────────────────────╯"
        
        # Create analysis script
        cat > /tmp/analyze.py << 'EOF'
        import sys
        import os
        import json

        # Skip if this IS the agent-quality-system repo (can't analyze itself)
        if os.path.exists('agents/enhanced_feature_extractor.py') and \
           os.path.exists('train_all_gates.py'):
            print("✓ This is the agent-quality-system repo - skipping self-analysis")
            sys.exit(0)

        # Add agent system to path
        sys.path.insert(0, os.getcwd())
        
        try:
            from agents.enhanced_feature_extractor import EnhancedFeatureExtractor
            from agents.all_gate_classifiers import AllGatesClassificationPipeline
        except ImportError:
            print("⚠️ Agent system not in this repo, using basic analysis")
            sys.exit(0)
        
        # Load config if exists
        config_path = "data/results/all_gates_optimal_config.json"
        try:
            with open(config_path) as f:
                config = json.load(f)
            pipeline_config = {g: {'activation': c.get('activation', 'sigmoid')} 
                               for g, c in config.get('gates', {}).items()}
        except:
            pipeline_config = {}
        
        extractor = EnhancedFeatureExtractor()
        pipeline = AllGatesClassificationPipeline(pipeline_config)
        
        # Get changed files from environment
        changed_files = os.environ.get('CHANGED_FILES', '').split()
        
        if not changed_files:
            print("✓ No source files changed")
            sys.exit(0)

        # Exclude training/demo/test files (intentionally contain issues)
        # Also exclude agent infrastructure (the analyzer analyzing itself)
        exclude_patterns = [
            'training/', 'data/', 'demo', 'test_', 'sample_',
            'agents/',  # Core agent infrastructure
            'batch_analyze', 'train_', 'sonarqube_', 'compare_',
            'fetch_sonar', 'detailed_report', 'visualize_'
        ]
        filtered_files = [f for f in changed_files
                          if not any(p in f for p in exclude_patterns)]

        if not filtered_files:
            print("✓ Only training/demo files changed (excluded from checks)")
            sys.exit(0)

        print(f"Analyzing {len(filtered_files)} file(s) ({len(changed_files) - len(filtered_files)} excluded)...")

        failed_files = []
        skip_gates = ['coverage_gate']  # Skip coverage (needs test framework)

        for filepath in filtered_files:
            if not os.path.exists(filepath):
                continue
            
            try:
                with open(filepath, 'r', encoding='utf-8', errors='ignore') as f:
                    code = f.read()
                
                features = extractor.extract_all_features(code, filepath)
                results = pipeline.classify(
                    features['bug_features'],
                    features['vulnerability_features'],
                    features['project_features']
                )
                
                failed_gates = [g for g, v in results.items() 
                               if v == 'FAIL' and g not in ['overall'] + skip_gates]
                
                if failed_gates:
                    failed_files.append({'file': filepath, 'gates': failed_gates})
                    print(f"  ✗ {filepath}")
                    for g in failed_gates:
                        print(f"    - {g.replace('_', ' ').title()}")
                else:
                    print(f"  ✓ {filepath}")
                    
            except Exception as e:
                print(f"  ⚠ {filepath}: {e}")
        
        print()
        if failed_files:
            print(f"╭──────────────────────────────────────────╮")
            print(f"│  ✗ {len(failed_files)} file(s) failed quality gates  │")
            print(f"╰──────────────────────────────────────────╯")
            sys.exit(1)
        else:
            print("╭──────────────────────────────────────────╮")
            print("│  ✓ All files passed quality gates!       │")
            print("╰──────────────────────────────────────────╯")
            sys.exit(0)
        EOF
        
        CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}" python /tmp/analyze.py
    
    - name: No files changed
      if: steps.changed-files.outputs.any_changed != 'true'
      run: |
        echo "✓ No source files changed, skipping analysis"

  # Optional: Comment on PR with results
  comment-results:
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name == 'pull_request' && always()
    
    steps:
    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ needs.quality-gate.result }}';
          const icon = status === 'success' ? '✅' : '❌';
          const message = status === 'success' 
            ? 'All files passed the Multi-Agent Quality Gate check!'
            : 'Some files failed the Quality Gate check. Please review the workflow logs.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## ${icon} Quality Gate ${status.charAt(0).toUpperCase() + status.slice(1)}\n\n${message}\n\n[View Details](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
          });
