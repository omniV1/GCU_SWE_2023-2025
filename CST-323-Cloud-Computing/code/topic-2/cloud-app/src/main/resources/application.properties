# ===========================================
# LOCAL DEVELOPMENT CONFIGURATION
# ===========================================
# Uses MariaDB JDBC driver (works with both local MariaDB and Azure MySQL)
# In Azure, these values are OVERRIDDEN by App Settings environment variables

# MariaDB driver uses jdbc:mariadb:// syntax
spring.datasource.url=jdbc:mariadb://localhost:3306/ordersDB
spring.datasource.username=omniv
spring.datasource.password=0002
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Server port (Azure App Service expects 8080)
server.port=8080

# Actuator endpoints for Azure health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ===========================================
# AZURE CONFIGURATION (set in App Settings)
# ===========================================
# In Azure Portal > Web App > Configuration > Application Settings, add:
#
# SPRING_DATASOURCE_URL=jdbc:mariadb://YOUR-SERVER.mysql.database.azure.com:3306/ordersDB?sslMode=REQUIRED&serverTimezone=UTC
# SPRING_DATASOURCE_USERNAME=adminuser@YOUR-SERVER
# SPRING_DATASOURCE_PASSWORD=YourSecurePassword (or use Key Vault reference)
#
# Spring Boot automatically maps these env vars to spring.datasource.* properties
# This keeps secrets OUT of your Git repository!
