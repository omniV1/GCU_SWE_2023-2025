<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f7fa 0%, #e1bee7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-title {
            text-align: center;
            font-size: 1.75rem;
            font-weight: 500;
            margin-bottom: 30px;
            color: #333;
        }
        .form-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            background-color: #f5f5f5;
        }
        .form-control:focus {
            border-color: #9c27b0;
            box-shadow: 0 0 0 0.2rem rgba(156, 39, 176, 0.15);
        }
        .form-text {
            font-size: 0.75rem;
            color: #999;
        }
        .btn-login {
            background-color: #9c27b0;
            border: none;
            border-radius: 8px;
            padding: 10px 40px;
            font-size: 1rem;
            color: white;
            width: 100%;
            margin-top: 20px;
        }
        .btn-login:hover {
            background-color: #7b1fa2;
            color: white;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #666;
        }
        .register-link a {
            color: #9c27b0;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #dc3545;
            text-align: center;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Login</h1>

        <div th:if="${param.error}" class="error-message">Invalid username or password</div>
        <div th:if="${param.logout}" class="alert alert-success text-center">You have been logged out</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                <div class="form-text">do not use special characters</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                <div class="form-text">at least 8 characters and one special character</div>
            </div>

            <button type="submit" class="btn btn-login">Login</button>
        </form>

        <div class="register-link">
            Don't have an account? <a th:href="@{/users/register}">Register</a>
        </div>
    </div>
</body>
</html>
