<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>Comments</title>
</head>
<body>
    <div layout:fragment="content">
        <h1>Comments</h1>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Author</th>
                    <th>Text</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comment : ${comments}">
                    <td th:text="${comment.id}">1</td>  
                    <td th:text="${comment.author}">Author</td>
                    <!-- Display the comment text with HTML escaping to prevent script execution -->
                    <td th:text="${comment.text}">Sample comment text</td>
                    <td>
                        <a th:href="@{/edit/{id}(id=${comment.id})}">Edit</a>
                        <a th:href="@{/delete/{id}(id=${comment.id})}">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div>
                <h1>Add Comment</h1>
                <form th:action="@{/add}" th:object="${comment}" method="post">
                    <div>
                        <label for="author">Author</label>
                        <input type="text" class="form-control" id="author" th:field="*{author}" placeholder="Enter your name" required>
                    </div>
                    <div>
                        <label for="text">Comment</label>
                        <textarea  id="text" th:field="*{text}" placeholder="Write your comment here" rows="20"  cols="150"></textarea>
                    </div>
                    <button type="submit" >Add Comment</button>
                </form>
        </div>
    </div>
</body>
</html>
