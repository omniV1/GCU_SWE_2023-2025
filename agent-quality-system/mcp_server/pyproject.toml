[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quality-gate-mcp"
version = "0.1.0"
description = "MCP server for multi-agent code quality analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Owen Lindsey" }
]
keywords = ["mcp", "code-quality", "static-analysis", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "numpy>=1.24.0",
    "radon>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
quality-gate-mcp = "quality_gate_mcp.server:run"

[project.urls]
Homepage = "https://github.com/omniV1/GCU_SWE_2023-2025"
Repository = "https://github.com/omniV1/GCU_SWE_2023-2025"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_gate_mcp"]
